<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Student Records </title>

    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #ecdaec;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: rgb(248, 247, 250);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(98, 139, 230, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #8daef5;
            color: rgb(58, 56, 56);
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Records</h1>

    {% if students %}

    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year & Section</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.student_id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.course }}</td>
                <td>{{ student.year_section }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    {% else %}

    <p class="no-data">No student records available.</p>

    {% endif %}

</div>

</body>
</html>
